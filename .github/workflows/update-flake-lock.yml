name: update-flake-lock

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 1" # Mondays, 12:00 UTC

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # Opens (or refreshes) a single PR with the updated flake.lock. Needs
      # "Allow GitHub Actions to create and approve pull requests" enabled in
      # the repository's Actions settings.
      - uses: DeterminateSystems/update-flake-lock@v29
        with:
          commit-msg: "updated flake inputs"
          pr-title: "updated flake inputs"
